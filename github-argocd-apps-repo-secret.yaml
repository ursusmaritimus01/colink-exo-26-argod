apiVersion: v1
kind: Secret
metadata:
  name: github-argocd-apps-repo-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: git@github.com:ursusmaritimus01/colink-exo-26-argod.git

  # VERVANG dit door de VOLLEDIGE inhoud van je SSH private key met toegang tot colink-exo-26-argod
  # Gebruik bij voorkeur dezelfde sleutel als voor colink-exo-26-deploy, of maak een nieuwe deploy key aan
  # via: GitHub repo → Settings → Deploy keys → Add deploy key
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    VERVANG_DIT_MET_DE_VOLLEDIGE_PRIVATE_KEY_INHOUD
    -----END OPENSSH PRIVATE KEY-----
