apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ursusmaritimus01/colink-exo-26-deploy.git
    targetRevision: HEAD
    path: exo-platform-breda/k8s/overlays/infra-argocd
    # kustomization.yaml aanwezig in dit pad — ArgoCD detecteert Kustomize automatisch
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
