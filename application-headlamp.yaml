apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-headlamp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ursusmaritimus01/colink-exo-26-deploy.git
    targetRevision: develop
    path: exo-platform-breda/k8s/base/infra-headlamp
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
