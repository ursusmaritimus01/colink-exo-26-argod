apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ursusmaritimus01/colink-exo-26-argod.git
    targetRevision: develop
    path: /argocd-apps
    # kustomization.yaml aanwezig → ArgoCD detecteert Kustomize automatisch
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
