apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: exo-platform
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: hetzner-breda
            url: https://kubernetes.default.svc
            environment: production
            host: 178-105-174-203.sslip.io
  template:
    metadata:
      name: "exo-platform-{{environment}}"
      labels:
        app.kubernetes.io/part-of: exo-platform
        environment: "{{environment}}"
    spec:
      project: default
      source:
        repoURL: git@github.com:ursusmaritimus01/colink-exo-26-deploy.git
        targetRevision: develop
        path: exo-platform-breda/k8s/overlays/exo-platform
        directory:
          recurse: false
      destination:
        server: "{{url}}"
        namespace: colink-exo-26-breda
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
